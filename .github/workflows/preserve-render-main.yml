name: Preserve Render configuration on main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-render-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restore Render Blueprint
        shell: bash
        run: |
          cat > render.yaml <<'EOF'
services:
  - type: keyvalue
    name: btc-redis
    plan: free
    region: virginia
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow application connections
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: btc-mcp
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SYMBOL
        value: BTCUSDT
      - key: INTERVAL_SECONDS
        value: "60"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: btc-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: btc-postgres
          property: connectionString
      - key: PREDICTOR_URL
        value: http://localhost:8001

databases:
  - name: btc-postgres
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: btc_ai
    user: btc
EOF

      - name: Commit Render configuration when needed
        shell: bash
        run: |
          if git diff --quiet -- render.yaml; then
            echo "Render configuration already preserved."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add render.yaml
          git commit -m "chore: preserve Render deployment configuration"
          git push origin HEAD:main
